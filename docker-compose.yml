services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schemely}
      POSTGRES_USER: ${POSTGRES_USER:-schemely}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schemely_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-schemely}
      PGUSER: ${POSTGRES_USER:-schemely}
      PGPASSWORD: ${POSTGRES_PASSWORD:-schemely_local}
      DATABASE_URL: postgresql+psycopg://
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 15
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/service/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
